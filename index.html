<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Kokoro TTS Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      --glass-bg: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent: #ec4899;
      --danger: #ef4444;
      --success: #10b981;
      --input-bg: rgba(0, 0, 0, 0.2);
    }
    
    body {
      font-family: 'Outfit', sans-serif;
      background: var(--bg-gradient);
      color: var(--text-main);
      padding: 40px 20px;
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    
    .container {
      width: 100%;
      max-width: 800px;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      box-sizing: border-box;
    }
    
    h2 {
      margin-top: 0;
      font-size: 2.2em;
      font-weight: 700;
      background: linear-gradient(to right, #a78bfa, #f472b6);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      text-align: center;
    }
    
    .control-group { margin-bottom: 24px; }
    label { display: block; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; font-size: 0.95em; }
    
    input[type="text"], select, textarea {
      width: 100%;
      padding: 12px 16px;
      background: var(--input-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      color: var(--text-main);
      font-family: 'Outfit', sans-serif;
      font-size: 1em;
      transition: all 0.3s ease;
      box-sizing: border-box;
    }
    
    input[type="text"]:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(139, 92, 246, 0.3);
    }
    
    select option { background: #1e293b; color: #fff; }
    
    button {
      font-family: 'Outfit', sans-serif;
      font-size: 1em;
      font-weight: 600;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    
    .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); }
    .btn-primary:hover:not(:disabled) { box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); }
    
    .btn-secondary { background: rgba(255, 255, 255, 0.1); border: 1px solid var(--glass-border); }
    .btn-secondary:hover:not(:disabled) { background: rgba(255, 255, 255, 0.2); }
    
    .btn-danger { background: rgba(239, 68, 68, 0.2); border: 1px solid rgba(239, 68, 68, 0.3); color: #fca5a5; }
    .btn-danger:hover:not(:disabled) { background: rgba(239, 68, 68, 0.4); color: #fff; }
    
    /* Setup Area */
    #setupArea {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      margin-bottom: 30px;
    }
    
    progress {
      width: 100%;
      height: 8px;
      border-radius: 4px;
      margin-top: 16px;
      -webkit-appearance: none;
    }
    progress::-webkit-progress-bar { background: var(--input-bg); border-radius: 4px; }
    progress::-webkit-progress-value { background: var(--primary); border-radius: 4px; }
    
    #progressText { margin-top: 12px; font-size: 0.9em; color: var(--text-muted); }
    
    /* Dialogue Blocks */
    .dialogue-block {
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
    }
    .dialogue-block:hover { border-color: rgba(255, 255, 255, 0.2); }
    
    .block-controls { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; justify-content: space-between; }
    .block-speaker-group { display: flex; gap: 10px; flex: 1; min-width: 200px; }
    .block-btn-group { display: flex; gap: 8px; }
    
    .block-speaker-name { width: 140px !important; }
    .block-text { height: 80px; resize: vertical; margin-top: 4px; }
    
    #addBlockBtn {
      width: 100%;
      background: transparent;
      border: 2px dashed rgba(255, 255, 255, 0.2);
      color: var(--text-muted);
      padding: 16px;
    }
    #addBlockBtn:hover {
      border-color: var(--primary);
      color: var(--text-main);
      background: rgba(139, 92, 246, 0.1);
    }
    
    /* Utility */
    .hint { font-size: 0.85em; color: var(--text-muted); margin-bottom: 12px; line-height: 1.5; }
    .warning { color: #fbbf24; }
    
    /* Advanced Settings */
    .advanced-toggle {
      display: inline-flex; align-items: center; gap: 8px;
      cursor: pointer; color: var(--text-muted); font-size: 0.9em;
      user-select: none; transition: color 0.3s;
    }
    .advanced-toggle:hover { color: var(--text-main); }
    
    #advancedSettings {
      background: rgba(0, 0, 0, 0.15); border-radius: 12px; padding: 16px;
      margin-top: 12px; border: 1px solid var(--glass-border);
    }
    
    .flex-row { display: flex; gap: 16px; flex-wrap: wrap; }
    .flex-row > div { flex: 1; min-width: 120px; }
    
    /* Range Slider */
    input[type=range] {
      -webkit-appearance: none; width: 100%; background: transparent; margin: 12px 0;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%;
      background: var(--accent); cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px var(--accent);
    }
    input[type=range]::-webkit-slider-runnable-track {
      width: 100%; height: 6px; cursor: pointer; background: rgba(255,255,255,0.1); border-radius: 4px;
    }
    
    #status {
      text-align: center; font-weight: 600; margin-top: 24px; min-height: 24px; color: var(--accent);
    }
    
    /* Result Area */
    #resultArea {
      margin-top: 24px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3);
      border-radius: 16px; padding: 24px; display: none; text-align: center;
    }
    audio { width: 100%; margin: 16px 0; height: 40px; border-radius: 20px; outline: none; }
    audio::-webkit-media-controls-panel { background: var(--glass-bg); }
    audio::-webkit-media-controls-current-time-display,
    audio::-webkit-media-controls-time-remaining-display { color: var(--text-main); }
    
    #downloadLink {
      display: block; width: 100%; text-decoration: none; text-align: center;
      background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; padding: 14px; border-radius: 12px;
      font-weight: 600; transition: all 0.3s ease; margin-bottom: 12px; box-sizing: border-box;
    }
    #downloadLink:hover { box-shadow: 0 0 15px rgba(236, 72, 153, 0.5); transform: translateY(-2px); }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lamejs/1.2.1/lame.min.js"></script>
</head>
<body>
  <div class="container">
    <h2>✨ Kokoro Studio</h2>

    <div id="setupArea">
      <p style="margin-top: 0;">高品質なAI音声モデル(約80MB)をブラウザにロードします</p>
      <button id="downloadBtn" class="btn-primary">AIモデルをロード</button>
      <progress id="progressBar" value="0" max="100" style="display: none;"></progress>
      <div id="progressText"></div>
    </div>
    
    <div class="control-group" id="dialogueEditorGroup">
      <label>対話エディター</label>
      <div class="hint">
        各入力欄ごとに話者を設定できます。「分割」を押すとカーソル位置で新しいブロックを作ります。<br>
        <span class="warning">※ 現在のブラウザ版ONNXモデルは英語専用です。英文を入力してください。</span>
      </div>
      
      <div id="dialogueContainer"></div>
      
      <button id="addBlockBtn">+ 新しい入力欄を追加</button>
    </div>

    <div class="control-group">
      <label>出力フォーマット</label>
      <select id="outputFormat">
        <option value="webm">WebM (標準・軽量)</option>
        <option value="wav">WAV (高音質・非圧縮)</option>
        <option value="mp3">MP3 (汎用)</option>
      </select>
    </div>

    <div style="margin-bottom: 24px;">
      <label class="advanced-toggle">
        <input type="checkbox" id="toggleAdvanced" style="width: auto; margin: 0;">
        詳細パラメーターを表示
      </label>
      
      <div id="advancedSettings" style="display: none; flex-direction: column; gap: 16px;">
        <div>
          <label style="margin-bottom: 0;">読み上げ速度: <span id="speedDisplay" style="color: var(--accent);">1.0</span>x</label>
          <input type="range" id="speechSpeed" min="0.5" max="2.0" step="0.1" value="1.0">
        </div>

        <div class="flex-row">
          <div>
            <label>チャンネル</label>
            <select id="channel">
              <option value="1">モノラル</option>
              <option value="2">ステレオ</option>
            </select>
          </div>
          <div>
            <label>サンプルレート</label>
            <select id="sampleRate">
              <option value="24000">24kHz</option>
              <option value="16000">16kHz</option>
            </select>
          </div>
          <div>
            <label>ビットレート</label>
            <select id="bitrate">
              <option value="64000">64 kbps</option>
              <option value="128000">128 kbps</option>
              <option value="192000">192 kbps</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <button id="generateBtn" class="btn-primary" style="width: 100%; font-size: 1.1em; padding: 16px;" disabled>音声を生成する</button>
    <div id="status"></div>

    <div id="resultArea">
      <h3 style="margin-top: 0; margin-bottom: 16px; color: #fff;">🎉 生成完了！</h3>
      <audio id="audioPlayer" controls></audio>
      <div style="display: flex; gap: 12px; flex-wrap: wrap;">
        <a id="downloadLink" href="#" download="speech.webm" style="flex: 1; min-width: 200px;">
          パソコンに保存
        </a>
        <button id="saveDriveBtn" class="btn-secondary" style="flex: 1; min-width: 200px; padding: 14px; margin-bottom: 12px;">Google Driveに保存</button>
      </div>
      <p id="driveStatus" style="font-size: 0.9em; margin-top: 12px; text-align: center;"></p>
    </div>
  </div>

  <!-- 最新版の Transformers.js 読み込み (Kokoro対応版) -->
  <script type="module">
    import { KokoroTTS } from 'https://cdn.jsdelivr.net/npm/kokoro-js@1.2.1/+esm';
    
    // UI要素の取得
    const downloadBtn = document.getElementById('downloadBtn');
    const generateBtn = document.getElementById('generateBtn');
    const progressBar = document.getElementById('progressBar');
    const progressText = document.getElementById('progressText');
    const setupArea = document.getElementById('setupArea');
    const statusText = document.getElementById('status');
    const resultArea = document.getElementById('resultArea');
    const audioPlayer = document.getElementById('audioPlayer');
    const downloadLink = document.getElementById('downloadLink');
    const saveDriveBtn = document.getElementById('saveDriveBtn');
    const driveStatus = document.getElementById('driveStatus');

    let synthesizer = null;
    let currentAudioBlob = null; // 生成された音声Blobを保持
    
    // GASのデプロイURL
    const GAS_URL = 'https://script.google.com/a/macros/yamagataps.jp/s/AKfycbxmVamqNrYxfTYhR3JquN1mksZZqbzpY94qGm9BNJqlNnPZiGkj4-2XgwXfkraL2ytfgw/exec';

    // ==========================================
    // 1. AIモデルのダウンロード処理
    // ==========================================
    downloadBtn.addEventListener('click', async () => {
      try {
        downloadBtn.disabled = true;
        progressBar.style.display = 'block';
        progressText.innerText = 'ダウンロードを開始しています...';

        // プログレスコールバックを使って進捗を表示（※kokoro-jsがprogress_callbackをサポートしている場合は反映されます）
        synthesizer = await KokoroTTS.from_pretrained('onnx-community/Kokoro-82M-v1.0-ONNX', {
          dtype: 'q8',
          device: 'wasm',
          // progress_callback を一応渡しておく
          progress_callback: (data) => {
            if (data.status === 'downloading') {
              progressText.innerText = `${data.file} をダウンロード中...`;
            } else if (data.status === 'progress') {
              progressBar.value = data.progress;
              progressText.innerText = `${data.file} : ${Math.round(data.progress)}%`;
            } else if (data.status === 'done') {
              progressText.innerText = `${data.file} の準備が完了しました`;
            }
          }
        });

        // ダウンロード完了後のUI変更
        progressText.innerText = '✅ モデルの準備が完了しました！音声を生成できます。';
        progressText.style.color = 'var(--success)';
        progressBar.style.display = 'none';
        downloadBtn.style.display = 'none';
        generateBtn.disabled = false; // 生成ボタンを有効化

      } catch (err) {
        progressText.innerText = 'エラーが発生しました: ' + err.message;
        progressText.style.color = 'var(--danger)';
        downloadBtn.disabled = false;
        console.error(err);
      }
    });

    // 詳細設定のトグル処理
    const toggleAdvanced = document.getElementById('toggleAdvanced');
    const advancedSettings = document.getElementById('advancedSettings');
    toggleAdvanced.addEventListener('change', (e) => {
      advancedSettings.style.display = e.target.checked ? 'flex' : 'none';
    });

    // 読み上げ速度スライダーの表示更新
    const speechSpeed = document.getElementById('speechSpeed');
    const speedDisplay = document.getElementById('speedDisplay');
    speechSpeed.addEventListener('input', (e) => {
      speedDisplay.innerText = Number(e.target.value).toFixed(1);
    });

    // 対話ブロックのUI生成ロジック
    const dialogueContainer = document.getElementById('dialogueContainer');
    const voiceOptionsHtml = `
      <option value="af_heart">米国・女性1 (US_F1)</option>
      <option value="af_sky">米国・女性2 (US_F2・高め)</option>
      <option value="am_adam">米国・男性1 (US_M1)</option>
      <option value="am_onyx">米国・男性2 (US_M2・低め)</option>
      <option value="bf_emma">英国・女性 (UK_F)</option>
      <option value="bm_george">英国・男性 (UK_M)</option>
    `;

    function createDialogueBlock(text = '', voiceId = 'af_heart', speakerName = '') {
      const block = document.createElement('div');
      block.className = 'dialogue-block';
      block.style.cssText = 'border: 1px solid #ddd; padding: 10px; margin-bottom: 10px; border-radius: 4px; background-color: #fafafa;';
      
      block.innerHTML = `
        <div class="block-controls">
          <div class="block-speaker-group">
            <input type="text" class="block-speaker-name" placeholder="話者名 (任意)" value="${speakerName}">
            <select class="block-voice">
              ${voiceOptionsHtml}
            </select>
          </div>
          <div class="block-btn-group">
            <button class="btn-secondary split-btn" style="padding: 8px 12px; font-size: 0.85em;">分割</button>
            <button class="btn-danger delete-btn" style="padding: 8px 12px; font-size: 0.85em;">削除</button>
          </div>
        </div>
        <textarea class="block-text" placeholder="ここに英語のテキストを入力...">${text}</textarea>
      `;
      
      block.querySelector('.block-voice').value = voiceId;
      
      block.querySelector('.delete-btn').addEventListener('click', () => {
        if (document.querySelectorAll('.dialogue-block').length > 1) {
          block.remove();
        } else {
          alert("最低1つのブロックが必要です。");
        }
      });

      block.querySelector('.split-btn').addEventListener('click', () => {
        const textarea = block.querySelector('.block-text');
        const cursorPos = textarea.selectionStart;
        const textAll = textarea.value;
        
        if (cursorPos === undefined || cursorPos === textAll.length) {
          const currentSpeaker = block.querySelector('.block-speaker-name').value;
          const newBlock = createDialogueBlock('', voiceId, currentSpeaker);
          block.after(newBlock);
        } else {
          const textBefore = textAll.substring(0, cursorPos);
          const textAfter = textAll.substring(cursorPos);
          textarea.value = textBefore;
          const currentSpeaker = block.querySelector('.block-speaker-name').value;
          const newBlock = createDialogueBlock(textAfter.trim(), voiceId, currentSpeaker);
          block.after(newBlock);
        }
      });

      return block;
    }

    document.getElementById('addBlockBtn').addEventListener('click', () => {
      dialogueContainer.appendChild(createDialogueBlock());
    });

    // 初期データの挿入: 空のブロックを1つだけ生成
    dialogueContainer.appendChild(createDialogueBlock("", "af_heart"));

    // ==========================================
    // 2. 音声の生成処理
    // ==========================================
    generateBtn.addEventListener('click', async () => {
      const blocks = document.querySelectorAll('.dialogue-block');
      if (blocks.length === 0 || !synthesizer) return;

      try {
        generateBtn.disabled = true;
        resultArea.style.display = 'none';
        
        let combinedAudio = [];
        let originalSampleRate = null;
        const speedParam = parseFloat(document.getElementById('speechSpeed').value);

        for (let b = 0; b < blocks.length; b++) {
          const block = blocks[b];
          const voiceId = block.querySelector('.block-voice').value;
          const speakerName = block.querySelector('.block-speaker-name').value.trim();
          const voiceLabel = block.querySelector('.block-voice').options[block.querySelector('.block-voice').selectedIndex].text.split(' ')[0];
          const displaySpeaker = speakerName ? speakerName : voiceLabel;
          
          const blockText = block.querySelector('.block-text').value.trim();
          
          if (!blockText) continue;
          
          const lines = blockText.split('\n');
          for (let i = 0; i < lines.length; i++) {
            let line = lines[i].trim();
            if (!line) continue;
            
            // 旧バージョンのタグが残っていれば除去
            line = line.replace(/^\[?(US_F1|US_F2|US_M1|US_M2|UK_F|UK_M)\]?[:：]\s*/i, '');
            if (!line) continue;
            
            statusText.innerText = `音声生成中... (${displaySpeaker} - ブロック ${b + 1}/${blocks.length}, 行 ${i + 1}/${lines.length})`;
            
            const result = await synthesizer.generate(line, { voice: voiceId, speed: speedParam });
            
            if (!originalSampleRate) {
              originalSampleRate = result.sampling_rate;
            }
            combinedAudio.push(result.audio);
          }
        }

        if (combinedAudio.length === 0) {
          throw new Error("生成するテキストがありません。");
        }

        // 複数行の音声を連結（行の間に0.3秒の無音を挿入）
        const silenceLength = Math.floor(originalSampleRate * 0.3);
        const totalLength = combinedAudio.reduce((sum, arr) => sum + arr.length, 0) + silenceLength * Math.max(0, combinedAudio.length - 1);
        const pcmData = new Float32Array(totalLength);
        
        let offset = 0;
        for (let i = 0; i < combinedAudio.length; i++) {
          pcmData.set(combinedAudio[i], offset);
          offset += combinedAudio[i].length;
          if (i < combinedAudio.length - 1) {
            offset += silenceLength;
          }
        }

        const rawAudioData = pcmData;

        statusText.innerText = '音声の圧縮とWebMフォーマットへの変換中...';

        const targetChannels = parseInt(document.getElementById('channel').value);
        const targetSampleRate = parseInt(document.getElementById('sampleRate').value);
        const targetBitrate = parseInt(document.getElementById('bitrate').value);
        const outputFormat = document.getElementById('outputFormat').value;

        statusText.innerText = `音声の圧縮と ${outputFormat.toUpperCase()} フォーマットへの変換中...`;

        let finalBlob;
        if (outputFormat === 'webm') {
          finalBlob = await encodeToWebM(rawAudioData, originalSampleRate, targetChannels, targetSampleRate, targetBitrate);
        } else if (outputFormat === 'wav') {
          finalBlob = await encodeToWav(rawAudioData, originalSampleRate, targetChannels, targetSampleRate);
        } else if (outputFormat === 'mp3') {
          finalBlob = await encodeToMp3(rawAudioData, originalSampleRate, targetChannels, targetSampleRate, targetBitrate);
        }

        const audioUrl = URL.createObjectURL(finalBlob);
        audioPlayer.src = audioUrl;
        downloadLink.href = audioUrl;
        
        const dateStr = new Date().toISOString().replace(/[:.]/g, '-');
        downloadLink.download = `speech_${dateStr}.${outputFormat}`;
        downloadLink.innerText = `この音声をダウンロード (.${outputFormat})`;
        
        currentAudioBlob = finalBlob; // 保存用に保持
        driveStatus.innerText = '';
        saveDriveBtn.disabled = false;
        
        statusText.innerText = '完了しました！';
        resultArea.style.display = 'block';

      } catch (err) {
        statusText.innerText = 'エラーが発生しました: ' + err.message;
        console.error(err);
      } finally {
        generateBtn.disabled = false;
      }
    });

    // ==========================================
    // 3. Googleドライブへの保存処理
    // ==========================================
    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onloadend = () => {
          // data:audio/webm;base64, の部分を削除して返す
          const base64data = reader.result.split(',')[1];
          resolve(base64data);
        };
        reader.onerror = reject;
        reader.readAsDataURL(blob);
      });
    }

    saveDriveBtn.addEventListener('click', async () => {
      if (!currentAudioBlob) return;
      try {
        saveDriveBtn.disabled = true;
        driveStatus.innerText = 'Googleドライブへ保存中... (しばらくお待ちください)';
        driveStatus.style.color = 'var(--text-muted)';
        
        const base64Data = await blobToBase64(currentAudioBlob);
        
        // 結合されたテキストと設定情報を構築
        const blocks = document.querySelectorAll('.dialogue-block');
        let fullText = "";
        let usedVoices = new Set();
        blocks.forEach((b, index) => {
           const select = b.querySelector('.block-voice');
           const v = select.options[select.selectedIndex].text.split(' ')[0]; // 短くするため最初の部分だけ
           const speakerName = b.querySelector('.block-speaker-name').value.trim();
           const displayName = speakerName ? `${speakerName} (${v})` : v;
           
           const t = b.querySelector('.block-text').value.trim();
           if(t) {
             fullText += `[B${index+1}: ${displayName}] ${t}\n`;
             usedVoices.add(displayName);
           }
        });

        const voiceModel = Array.from(usedVoices).join(", ");
        const speed = document.getElementById('speechSpeed').value;
        const channel = document.getElementById('channel').options[document.getElementById('channel').selectedIndex].text;
        const sampleRate = document.getElementById('sampleRate').options[document.getElementById('sampleRate').selectedIndex].text;
        const bitrate = document.getElementById('bitrate').options[document.getElementById('bitrate').selectedIndex].text;
        const outputFormat = document.getElementById('outputFormat').value;
        
        const payload = {
          text: fullText,
          voiceModel: voiceModel,
          settings: `速度: ${speed}x, チャンネル: ${channel}, サンプルレート: ${sampleRate}, ビットレート: ${bitrate}`,
          audioBase64: base64Data,
          format: outputFormat
        };

        const response = await fetch(GAS_URL, {
          method: 'POST',
          // GASでCORSエラーを防ぐため text/plain を使用
          headers: {
            'Content-Type': 'text/plain;charset=utf-8',
          },
          body: JSON.stringify(payload)
        });

        const result = await response.json();
        if (result.status === 'success') {
          driveStatus.innerHTML = `✅ 保存成功！ <a href="${result.url}" target="_blank">Googleドライブで開く</a>`;
          driveStatus.style.color = 'var(--success)';
        } else {
          throw new Error(result.message || '保存に失敗しました');
        }
      } catch (err) {
        driveStatus.innerText = `❌ エラー: ${err.message}`;
        driveStatus.style.color = 'var(--danger)';
        saveDriveBtn.disabled = false;
      }
    });

    // ==========================================
    // 4. 音声変換関数群 (WebM, WAV, MP3)
    // ==========================================
    
    // オフラインコンテキストを使ったリサンプリング
    async function resampleAudio(pcmData, originalSampleRate, targetSampleRate, targetChannels) {
      const offlineCtx = new OfflineAudioContext(targetChannels, Math.ceil(pcmData.length * targetSampleRate / originalSampleRate), targetSampleRate);
      const audioBuffer = offlineCtx.createBuffer(1, pcmData.length, originalSampleRate);
      audioBuffer.getChannelData(0).set(pcmData);

      const source = offlineCtx.createBufferSource();
      source.buffer = audioBuffer;
      source.connect(offlineCtx.destination);
      source.start();

      return await offlineCtx.startRendering();
    }

    async function encodeToWebM(pcmData, originalSampleRate, channels, sampleRate, bitrate) {
      return new Promise(async (resolve) => {
        const audioBuffer = await resampleAudio(pcmData, originalSampleRate, sampleRate, channels);
        const ctx = new AudioContext({ sampleRate: sampleRate });
        
        const dest = ctx.createMediaStreamDestination();
        dest.channelCount = channels;

        const source = ctx.createBufferSource();
        source.buffer = audioBuffer;
        source.connect(dest);

        const recorder = new MediaRecorder(dest.stream, {
          mimeType: 'audio/webm;codecs=opus',
          audioBitsPerSecond: bitrate
        });

        const chunks = [];
        recorder.ondataavailable = (e) => {
          if (e.data.size > 0) chunks.push(e.data);
        };

        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: 'audio/webm' });
          ctx.close();
          resolve(blob);
        };

        recorder.start();
        source.start();
        source.onended = () => recorder.stop();
      });
    }

    async function encodeToWav(pcmData, originalSampleRate, channels, sampleRate) {
      const audioBuffer = await resampleAudio(pcmData, originalSampleRate, sampleRate, channels);
      const numChannels = audioBuffer.numberOfChannels;
      const bitDepth = 16;
      
      let samples;
      if (numChannels === 2) {
        const left = audioBuffer.getChannelData(0);
        const right = audioBuffer.getChannelData(1);
        samples = new Float32Array(left.length + right.length);
        for (let i = 0; i < left.length; i++) {
          samples[i * 2] = left[i];
          samples[i * 2 + 1] = right[i];
        }
      } else {
        samples = audioBuffer.getChannelData(0);
      }
      
      const buffer = new ArrayBuffer(44 + samples.length * 2);
      const view = new DataView(buffer);
      
      const writeString = (v, offset, string) => {
        for (let i = 0; i < string.length; i++) v.setUint8(offset + i, string.charCodeAt(i));
      };
      
      writeString(view, 0, 'RIFF');
      view.setUint32(4, 36 + samples.length * 2, true);
      writeString(view, 8, 'WAVE');
      writeString(view, 12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, 1, true); // PCM
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * numChannels * 2, true);
      view.setUint16(32, numChannels * 2, true);
      view.setUint16(34, bitDepth, true);
      writeString(view, 36, 'data');
      view.setUint32(40, samples.length * 2, true);
      
      let offset = 44;
      for (let i = 0; i < samples.length; i++, offset += 2) {
        let s = Math.max(-1, Math.min(1, samples[i]));
        view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
      }
      
      return new Blob([view], { type: 'audio/wav' });
    }

    async function encodeToMp3(pcmData, originalSampleRate, channels, sampleRate, bitrate) {
      if (typeof lamejs === 'undefined') {
        throw new Error("lamejsライブラリが読み込まれていません。ネットワークを確認してください。");
      }
      
      const audioBuffer = await resampleAudio(pcmData, originalSampleRate, sampleRate, channels);
      const numChannels = audioBuffer.numberOfChannels;
      
      const mp3encoder = new lamejs.Mp3Encoder(numChannels, sampleRate, Math.round(bitrate / 1000));
      const mp3Data = [];
      const sampleBlockSize = 1152;
      
      const left = audioBuffer.getChannelData(0);
      const right = numChannels === 2 ? audioBuffer.getChannelData(1) : left;
      
      const leftInt16 = new Int16Array(left.length);
      const rightInt16 = new Int16Array(right.length);
      
      for (let i = 0; i < left.length; i++) {
        let sL = Math.max(-1, Math.min(1, left[i]));
        leftInt16[i] = sL < 0 ? sL * 0x8000 : sL * 0x7FFF;
        if (numChannels === 2) {
          let sR = Math.max(-1, Math.min(1, right[i]));
          rightInt16[i] = sR < 0 ? sR * 0x8000 : sR * 0x7FFF;
        }
      }

      for (let i = 0; i < leftInt16.length; i += sampleBlockSize) {
        const leftChunk = leftInt16.subarray(i, i + sampleBlockSize);
        const rightChunk = numChannels === 2 ? rightInt16.subarray(i, i + sampleBlockSize) : leftChunk;
        
        const mp3buf = numChannels === 2 
          ? mp3encoder.encodeBuffer(leftChunk, rightChunk) 
          : mp3encoder.encodeBuffer(leftChunk);
          
        if (mp3buf.length > 0) mp3Data.push(mp3buf);
      }

      const mp3buf = mp3encoder.flush();
      if (mp3buf.length > 0) mp3Data.push(mp3buf);

      return new Blob(mp3Data, { type: 'audio/mp3' });
    }
  </script>
